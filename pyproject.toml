[build-system]
requires = ["build>=1.0", "setuptools>=75.0", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "censusgeocode"
dynamic = ["version"]
description = "Thin Python wrapper for the US Census Geocoder"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Neil Freeman", email = "contact@fakeisthenewreal.org"}
]
keywords = ["census", "geocode", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "requests[security]>=2.27",
    "requests-toolbelt>=0.9.1",
]

[project.urls]
Homepage = "https://github.com/fitnr/censusgeocode"
"Bug Tracker" = "https://github.com/fitnr/censusgeocode/issues"
Repository = "https://github.com/fitnr/censusgeocode.git"
Changelog = "https://github.com/fitnr/censusgeocode/blob/master/HISTORY"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "type"},
]
tests = [
    {include-group = "test"},
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "vcrpy>=6",
]
lint = [
    "ruff~=0.15.4",
]
type = [
    "mypy>=1.14",
    "types-requests>=2.27",
]

[project.scripts]
censusgeocode = "censusgeocode.__main__:main"

[tool]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "censusgeocode.__version__"}

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "requests_toolbelt.*",
    "vcr",
]
follow_untyped_imports = true

[tool.pytest]

[tool.pytest.ini_options]
addopts = "-n auto --cov"

[tool.coverage]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "src/censusgeocode/",
]

[tool.coverage.paths]
source = [
    "src/censusgeocode/",
]

[tool.coverage.report]
show_missing = true
